[metadata]
name = insurance-risk-analytics
version = 1.0.0
author = Analytics Team
author_email = team@example.com
description = End-to-end insurance risk analytics and predictive modeling
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/abigiyacodehub/insurance-risk-analytics
project_urls =
    Bug Tracker = https://github.com/abigiyacodehub/insurance-risk-analytics/issues
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.8
install_requires =
    pandas>=2.0.0
    numpy>=1.24.0
    scikit-learn>=1.0.0
    matplotlib>=3.5.0
    seaborn>=0.12.0
    plotly>=5.0.0
    scipy>=1.8.0
    statsmodels>=0.13.0
    dvc>=3.0.0

[options.packages.find]
where = .

[options.extras_require]
dev =
    pytest>=7.0.0
    pytest-cov>=3.0.0
    black>=22.0.0
    flake8>=4.0.0
    isort>=5.10.0
jupyter =
    jupyter>=1.0.0
    jupyterlab>=3.0.0
    ipython>=7.0.0
